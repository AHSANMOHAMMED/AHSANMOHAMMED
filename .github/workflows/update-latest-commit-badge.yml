name: Update Latest Commit Badge

on:
  push:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (for script)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Save script
        run: cp .github/scripts/generate-badge.py /tmp/generate-badge.py

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output

      - name: Generate latest commit badge
        run: python3 /tmp/generate-badge.py

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest-commit.svg
          git diff --cached --quiet || git commit -m "chore: update latest commit badge [skip ci]"
          git push
