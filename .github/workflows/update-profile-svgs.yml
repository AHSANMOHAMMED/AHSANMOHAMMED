name: Update Profile SVGs

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC (11:30 IST)
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    name: Regenerate Profile SVGs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate contribution SVGs
        run: python3 .github/scripts/generate-svgs.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Generate repo heatmap
        run: python3 .github/scripts/generate-repo-heatmap.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update profile SVGs [skip ci]"
            git push
          fi
